<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de Jogos 2D</title>
<style>
:root{
  --noite:#1A1147; --roxo:#2C1D74; --rosa:#FF3D81; --sol:#FFD23F; --ciano:#2DE2E6; --creme:#FFF6E0;
  --display:Impact,"Arial Black","Haettenschweiler",sans-serif;
  --texto:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--noite);color:var(--creme);font-family:var(--texto);line-height:1.6}
a{color:inherit}
:focus-visible{outline:3px solid var(--ciano);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}

header{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-family:var(--display);font-size:1.6rem;letter-spacing:1px;text-decoration:none;color:var(--sol);text-shadow:3px 3px 0 var(--rosa)}
nav a{margin-left:24px;text-decoration:none;font-weight:600}
nav a:hover{color:var(--sol)}

.hero{position:relative;overflow:hidden;border-bottom:6px solid var(--rosa)}
#fundo{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.hero .wrap{position:relative;z-index:1;padding-top:8px;padding-bottom:96px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(3rem,10vw,7rem);line-height:.95;letter-spacing:1px;
  color:var(--creme);text-shadow:5px 5px 0 var(--rosa),10px 10px 0 var(--roxo);margin:56px 0 24px}
.hero p{max-width:34ch;font-size:1.2rem;margin-bottom:32px}
.btn{display:inline-block;background:var(--sol);color:var(--noite);font-family:var(--display);font-size:1.3rem;letter-spacing:1px;
  padding:14px 32px;text-decoration:none;border:3px solid var(--noite);box-shadow:6px 6px 0 var(--rosa);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--rosa)}
.btn:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--rosa)}

main{padding:64px 0 32px}
h2{font-family:var(--display);font-weight:400;font-size:2.4rem;letter-spacing:1px;color:var(--sol);margin-bottom:8px}
.sub{opacity:.8;margin-bottom:24px}
.filtros{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:32px}
.filtros button{font:inherit;font-weight:600;cursor:pointer;background:transparent;color:var(--creme);
  border:2px solid var(--ciano);padding:6px 18px;transition:background .15s}
.filtros button:hover{background:var(--roxo)}
.filtros button[aria-pressed="true"]{background:var(--ciano);color:var(--noite)}

.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px}
.card{position:relative;display:flex;flex-direction:column;background:var(--roxo);border:3px solid var(--creme);
  text-decoration:none;box-shadow:7px 7px 0 var(--c);transition:transform .12s,box-shadow .12s}
a.card:hover{transform:translate(-3px,-3px);box-shadow:11px 11px 0 var(--c)}
.capa{height:150px;display:grid;place-items:center;border-bottom:3px solid var(--creme);
  background:repeating-linear-gradient(45deg,var(--c) 0 14px,color-mix(in srgb,var(--c) 80%,#000) 14px 28px)}
.capa span{font-family:var(--display);font-size:5.5rem;line-height:1;color:var(--creme);text-shadow:4px 4px 0 var(--noite)}
.info{padding:16px 18px 20px}
.info h3{font-family:var(--display);font-weight:400;font-size:1.5rem;letter-spacing:1px}
.info p{font-size:.95rem;opacity:.85;margin:4px 0 12px}
.selo{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;background:var(--sol);color:var(--noite)}
.card[aria-disabled="true"]{opacity:.7;cursor:not-allowed}
.card[aria-disabled="true"] .selo{background:var(--creme)}
.card.vazio{background:transparent;border:3px dashed var(--ciano);box-shadow:none;justify-content:center;align-items:center;text-align:center;padding:32px;min-height:280px}
.card.vazio h3{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--ciano)}
.oculto{display:none!important}

footer{margin-top:64px;padding:32px 0;border-top:3px solid var(--roxo);opacity:.8;font-size:.95rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
@media (max-width:560px){nav a{margin-left:14px}}
</style>
</head>
<body>

<section class="hero">
  <canvas id="fundo" aria-hidden="true"></canvas>
  <div class="wrap">
    <header>
      <a class="logo" href="index.html">PLAYPORTAL</a>
      <nav aria-label="Principal">
        <a href="#jogos">Jogos</a>
        <a href="#sobre">Sobre</a>
      </nav>
    </header>
    <h1>Aperte start.<br>Jogue agora.</h1>
    <p>Jogos 2D feitos à mão, direto no navegador. Sem instalar nada, sem cadastro.</p>
    <a class="btn" href="#jogos">Escolher um jogo</a>
  </div>
</section>

<main class="wrap" id="jogos">
  <h2>Escolha seu jogo</h2>
  <p class="sub">Cada jogo abre em sua própria página.</p>
  <div class="filtros" role="group" aria-label="Filtrar por categoria"></div>
  <div class="grade" id="grade"></div>
</main>

<footer class="wrap" id="sobre">
  <p>Feito com HTML, CSS e JavaScript. Novos jogos entram no cardápio a cada semana.</p>
</footer>

<script>
const JOGOS = [
  {nome:"Cobrinha",   desc:"Coma, cresça e não bata em você mesma.", cat:"Arcade", cor:"#FF3D81", url:"cobrinha.html",  pronto:false},
  {nome:"Pong",       desc:"O clássico duelo de raquetes.",           cat:"Arcade", cor:"#2DE2E6", url:"pong.html",      pronto:false},
  {nome:"Invasores",  desc:"Defenda a Terra de naves em formação.",   cat:"Ação",   cor:"#FFD23F", url:"invasores.html", pronto:false},
  {nome:"Memória",    desc:"Encontre os pares antes do tempo acabar.",cat:"Puzzle", cor:"#8A6BFF", url:"memoria.html",   pronto:false},
  {nome:"Tijolos",    desc:"Rebata a bola e destrua a parede.",       cat:"Arcade", cor:"#FF8A3D", url:"tijolos.html",   pronto:false},
  {nome:"Saltador",   desc:"Pule entre plataformas sem cair.",        cat:"Ação",   cor:"#3DDC84", url:"saltador.html",  pronto:false}
];

const grade = document.getElementById("grade");
const filtros = document.querySelector(".filtros");
let categoriaAtiva = "Todos";

function desenharCards(){
  grade.innerHTML = "";
  JOGOS.forEach(j => {
    const el = document.createElement(j.pronto ? "a" : "div");
    el.className = "card";
    el.style.setProperty("--c", j.cor);
    el.dataset.cat = j.cat;
    if(j.pronto){ el.href = j.url; } else { el.setAttribute("aria-disabled","true"); }
    el.innerHTML =
      `<div class="capa"><span>${j.nome[0]}</span></div>
       <div class="info"><h3>${j.nome}</h3><p>${j.desc}</p>
       <span class="selo">${j.pronto ? "Jogar" : "Em breve"}</span></div>`;
    grade.appendChild(el);
  });
  const vazio = document.createElement("div");
  vazio.className = "card vazio";
  vazio.dataset.cat = "*";
  vazio.innerHTML = `<h3>Seu próximo jogo entra aqui</h3>`;
  grade.appendChild(vazio);
}

function desenharFiltros(){
  ["Todos", ...new Set(JOGOS.map(j => j.cat))].forEach(cat => {
    const b = document.createElement("button");
    b.textContent = cat;
    b.setAttribute("aria-pressed", cat === categoriaAtiva);
    b.onclick = () => { categoriaAtiva = cat; aplicarFiltro(); };
    filtros.appendChild(b);
  });
}

function aplicarFiltro(){
  filtros.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.textContent === categoriaAtiva));
  grade.querySelectorAll(".card").forEach(c => {
    const mostrar = categoriaAtiva === "Todos" || c.dataset.cat === categoriaAtiva || c.dataset.cat === "*";
    c.classList.toggle("oculto", !mostrar);
  });
}

desenharCards();
desenharFiltros();

const cv = document.getElementById("fundo"), ctx = cv.getContext("2d");
const cores = ["#FF3D81","#FFD23F","#2DE2E6","#8A6BFF"];
let blocos = [];
function ajustar(){
  cv.width = cv.offsetWidth; cv.height = cv.offsetHeight;
  blocos = Array.from({length: Math.floor(cv.width/40)}, () => novoBloco(true));
}
function novoBloco(aleatorioY){
  const t = [16,24,32][Math.floor(Math.random()*3)];
  return {x:Math.floor(Math.random()*cv.width/t)*t, y:aleatorioY ? Math.random()*cv.height : -t, t, v:.4+Math.random()*1.2, c:cores[Math.floor(Math.random()*4)]};
}
function quadro(){
  ctx.clearRect(0,0,cv.width,cv.height);
  blocos.forEach((b,i) => {
    b.y += b.v;
    if(b.y > cv.height) blocos[i] = novoBloco(false);
    ctx.fillStyle = b.c; ctx.fillRect(b.x, b.y, b.t, b.t);
    ctx.strokeStyle = "#1A1147"; ctx.lineWidth = 3; ctx.strokeRect(b.x, b.y, b.t, b.t);
  });
  requestAnimationFrame(quadro);
}
ajustar();
window.addEventListener("resize", ajustar);
if(matchMedia("(prefers-reduced-motion:reduce)").matches){
  blocos.forEach(b => { ctx.fillStyle = b.c; ctx.fillRect(b.x, b.y, b.t, b.t); });
} else { quadro(); }
</script>
</body>
</html>
